name: Validate and package
on:
  push:
    branches: ["codex/forgotten-voices-stage1"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_content.py
      - run: python tools/narrative_audit.py
      - run: python -m pytest -q --junitxml=reports/junit-ci.xml
      - run: python tools/playtest_route.py
      - run: python main.py --headless --frames 60 --user-dir work/smoke
      - name: Package Windows standalone
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --windowed --name 3DPsychocal --icon assets/ui/icon.ico --add-data "assets;assets" --add-data "data;data" main.py
      - name: Smoke test actual Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\3DPsychocal\3DPsychocal.exe' -ArgumentList '--headless','--frames','60','--user-dir','work\exe-smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE failed with code $($p.ExitCode)" }
      - name: Source ZIP
        if: runner.os == 'Linux'
        run: python tools/package_source.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: 3DPsychocal-Windows
          path: dist/3DPsychocal/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: 3DPsychocal-source
          path: dist/3DPsychocal-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: reports/
